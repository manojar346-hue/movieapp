{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">My Movie Collection</h2>

<div class="movie-grid">
    {% for movie in movies %}
        <div class="movie-card">
            <img src="{{ movie.poster }}" class="movie-poster">

            <div class="movie-info">
                <h5>{{ movie.title }}</h5>
                <p>{{ movie.genre }}</p>

                <a href="{{ url_for('movie_details', movie_id=movie.id) }}" 
                   class="btn btn-outline-primary btn-sm mt-2">Details</a>
            </div>
        </div>
    {% endfor %}
</div>

{% endblock %}
